<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagination Score</title>
<style>
  :root { --ink: #000; --mute: #777; --faint: #bbb; --bg: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  #head { position: fixed; left: 28px; top: 22px; z-index: 5; pointer-events: none; }
  #head h1 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  #head p { font-size: 11px; color: var(--mute); margin: 0; }
  #ctrl { position: fixed; right: 24px; top: 22px; z-index: 5; display: flex; gap: 6px; }
  #ctrl button { font: inherit; font-size: 12px; background: #fff; border: 1px solid #000; padding: 4px 10px; cursor: pointer; }
  #ctrl button.on { background: #000; color: #fff; }
  #ctrl button:disabled { border-color: #ccc; color: #bbb; cursor: default; }
  #key { position: fixed; left: 28px; bottom: 18px; font-size: 11px; color: var(--mute); z-index: 5; max-width: calc(100% - 56px); line-height: 1.7; }
  #note { position: fixed; left: 28px; top: 70px; font-size: 12px; z-index: 5; }
  .lb { font-size: 12px; color: #000; white-space: nowrap; background: rgba(255,255,255,.82); padding: 0 3px; transform: translate(14px, -50%); }
  .lb small { display: block; font-size: 9.5px; color: #888; }
  .lb.inf { color: #999; }
  .lc { font-size: 11px; color: #222; white-space: nowrap; background: rgba(255,255,255,.82); padding: 0 3px; }
  .lo { font-size: 10px; color: #555; white-space: nowrap; }
  .ax { font-size: 11px; color: #888; white-space: nowrap; }
  .axt { font-size: 12px; color: #000; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="head"><h1 id="title"></h1><p id="meta"></p></div>
<div id="ctrl">
  <button id="bA" class="on">方案 A：链的步数</button>
  <button id="bC">方案 C：步数 + 向量</button>
  <button id="bL">中 / EN</button>
</div>
<div id="note"></div>
<div id="key">
  x = 画面位置（左→右） · y = 时间（过去 −1 / 此刻 0 / 未来 +1 / 超时间 +2） · z = 离可见世界的距离<br>
  ● 可见载体（都在“此刻 × 画面”这条线上） · ◯ 缺席的对象 R · 黑梭 = 操作（文本证据） · 线框梭 = 仅图像 · 灰虚线 = 推断，不计分 · 点线 = 坐标投影 · 拖动旋转，滚轮缩放
</div>
<script id="data" type="application/json">__DATA__</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const ALL = JSON.parse(document.getElementById('data').textContent).works;
let D = ALL[0], cur = 0, cReady = false;
const OPZ = {externalize:'外化',personify:'拟人化',embody:'赋形',inscribe:'铭写',substitute:'象征替代',synecdoche:'提喻',depth_time:'纵深=时间',anachronism:'时代错置',layer:'分层',radiate:'中心辐射',repeat:'重复',juxtapose:'并置',witness:'见证',impossible_viewpoint:'不可能视点',activate:'仪式激活'};
const ABZ = {inner:'内在',invisible:'不可见',unreachable:'不可达',nonexistent:'不存在',not_yet:'未至',supernatural:'超自然'};
const SX = 10, SY = 2.4, SZ = 3.0;               // world units per axis unit
const ZMAX = 3.0;
let plan = 'A', zh = true;

const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
const fitCam = () => { const k = Math.max(1, 1.5 / camera.aspect); camera.position.set(9 * k, 6.5 * k, 16 * k - 3); };
fitCam();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const css = new CSS2DRenderer(); css.setSize(innerWidth, innerHeight);
Object.assign(css.domElement.style, { position: 'absolute', top: '0', pointerEvents: 'none' });
document.body.appendChild(css.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, -3); controls.enableDamping = true; controls.update();

const P = (x, y, z) => new THREE.Vector3((x - 0.5) * SX, y * SY, -z * SZ);
const M = { ink: new THREE.LineBasicMaterial({ color: 0x000000 }),
            box: new THREE.LineBasicMaterial({ color: 0xcfcfcf }),
            grid: new THREE.LineBasicMaterial({ color: 0xececec }),
            now: new THREE.LineBasicMaterial({ color: 0x000000 }),
            drop: new THREE.LineDashedMaterial({ color: 0xaaaaaa, dashSize: 0.06, gapSize: 0.1 }),
            inf: new THREE.LineDashedMaterial({ color: 0xaaaaaa, dashSize: 0.12, gapSize: 0.12 }),
            nest: new THREE.LineDashedMaterial({ color: 0x555555, dashSize: 0.14, gapSize: 0.1 }) };
const seg = (a, b, m, parent) => { const g = new THREE.BufferGeometry().setFromPoints([a, b]); const l = new THREE.Line(g, m); if (m.isLineDashedMaterial) l.computeLineDistances(); parent.add(l); return l; };
const label = (html, pos, cls, parent) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; const o = new CSS2DObject(d); o.position.copy(pos); parent.add(o); return o; };

// ── static frame: axes, time levels, grid ──
const frame = new THREE.Group(); scene.add(frame);
const TL = [['过去','past'],['此刻','now'],['未来','future'],['超时间','beyond time']];
for (let y = -1; y <= 2; y++) {
  const m = y === 0 ? M.now : M.box;
  const c = [P(0,y,0), P(1,y,0), P(1,y,ZMAX), P(0,y,ZMAX)];
  for (let i = 0; i < 4; i++) { if (y === 0 && i === 0) continue; seg(c[i], c[(i+1)%4], y === 0 ? M.box : m, frame); }
}
seg(P(0,0,0), P(1,0,0), M.now, frame);                                   // the picture line: now × visible
for (const [x0,z0] of [[0,0],[1,0],[0,ZMAX],[1,ZMAX]]) seg(P(x0,-1,z0), P(x0,2,z0), M.box, frame);
for (let x = 0.25; x < 1; x += 0.25) seg(P(x,0,0), P(x,0,ZMAX), M.grid, frame);
for (let z = 1; z <= 2; z++) seg(P(0,0,z), P(1,0,z), M.grid, frame);
const axLabels = [];
for (let y = -1; y <= 2; y++) axLabels.push([label('', P(-0.04, y, 0), 'ax', frame), () => `${zh ? TL[y+1][0] : TL[y+1][1]} ${y > 0 ? '+' : ''}${y}`]);
for (let i = 0; i <= 4; i++) label((i/4).toFixed(2), P(i/4, -1.12, 0), 'ax', frame);
for (let z = 0; z <= 2; z++) axLabels.push([label('', P(1.04, -1, z), 'ax', frame), () => z === 0 ? (zh ? '0 可见' : '0 visible') : `${z} ${zh ? '步' : 'step'}`]);
axLabels.push([label('', P(0.5, -1.3, 0), 'axt', frame), () => zh ? 'x　画面位置：左 → 右' : 'x  position in picture'],
              [label('', P(-0.04, 2.35, 0), 'axt', frame), () => zh ? 'y　时间' : 'y  time'],
              [label('', P(1.05, -1, ZMAX + 0.2), 'axt', frame), () => (zh ? 'z　离可见世界的距离' : 'z  distance from the visible') + (plan === 'A' ? (zh ? '（A：链的步数）' : ' (A: steps)') : (zh ? '（C：步数 + 向量）' : ' (C: steps + embedding)'))]);

// ── content (rebuilt on plan / language switch) ──
let content = null;
const nodes = {};
const pos = n => n.isRef ? P(n.x, n.time, plan === 'A' ? n.zA : n.zC) : P(n.x, 0, 0);
const nm = n => zh ? n.zh : n.en;

function spindle(a, b, filled) {
  const pts = []; for (let i = 0; i <= 16; i++) { const t = i / 16; pts.push(new THREE.Vector2(Math.sin(Math.PI * t) * 0.07 * (1 - 0.35 * t), t * 0.75 - 0.375)); }
  const g = new THREE.LatheGeometry(pts, 10);
  const m = filled ? new THREE.MeshBasicMaterial({ color: 0x000000 }) : new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
  const s = new THREE.Mesh(g, m);
  const dir = b.clone().sub(a); const L = dir.length(); dir.normalize();
  s.position.copy(a.clone().addScaledVector(dir, L * 0.55));
  s.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  const k = Math.min(1, L / 2); s.scale.set(1, k, 1);
  return s;
}
function refMarker(r) {
  const g = new THREE.Group(); const ink = r.inferred ? 0xaaaaaa : 0x000000;
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.175, 48), new THREE.MeshBasicMaterial({ color: ink, side: THREE.DoubleSide }));
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.15, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
  g.add(disc, ring);
  const fill = (a0, a1) => g.add(new THREE.Mesh(new THREE.CircleGeometry(0.15, 32, a0, a1 - a0), new THREE.MeshBasicMaterial({ color: ink, side: THREE.DoubleSide })));
  if (r.kind === 'being') fill(Math.PI / 2, Math.PI * 1.5);
  else if (r.kind === 'experience') g.add(new THREE.Mesh(new THREE.CircleGeometry(0.07, 32), new THREE.MeshBasicMaterial({ color: ink })));
  else if (r.kind === 'event') fill(0, Math.PI / 2);
  else if (r.kind === 'concept') { fill(0, Math.PI / 2); fill(Math.PI, Math.PI * 1.5); }
  if (r.embodied) for (let j = 1; j <= 3; j++) g.add(new THREE.Mesh(new THREE.RingGeometry(0.175 + j * 0.06, 0.185 + j * 0.06, 48), new THREE.MeshBasicMaterial({ color: ink, side: THREE.DoubleSide })));
  disc.position.z = -0.001; g.userData.billboard = true;
  return g;
}

function build() {
  if (content) { content.traverse(o => { if (o.isCSS2DObject) o.element.remove(); }); scene.remove(content); }
  content = new THREE.Group(); scene.add(content);
  // carriers
  const sorted = [...D.carriers].sort((a, b) => a.x - b.x); let last = -9, row = 0;
  for (const c of sorted) {
    const p = pos(nodes[c.id]);
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.09, 20, 14), new THREE.MeshBasicMaterial({ color: 0 })); s.position.copy(p); content.add(s);
    row = c.x - last < 0.06 ? row + 1 : 0; last = c.x;
    const lp = p.clone().add(new THREE.Vector3(0, -0.28 - row * 0.3, 0.02));
    seg(p, lp, M.box, content);
    label(nm(c), lp, 'lc', content);
  }
  // referents + coordinate projections
  for (const r of D.referents) {
    const n = nodes[r.id], p = pos(n), z = plan === 'A' ? r.zA : r.zC;
    seg(p, P(r.x, 0, z), M.drop, content); seg(P(r.x, 0, z), P(r.x, 0, 0), M.drop, content);
    const mk = refMarker(r); mk.position.copy(p); content.add(mk);
    const zs = plan === 'A' ? String(z) : Number(z).toFixed(2);
    label(`${nm(r)}<small>${r.id} · ${zh ? ABZ[r.absence] : r.absence} · (${r.x.toFixed(2)}, ${r.time}, ${zs})</small>`, p, 'lb' + (r.inferred ? ' inf' : ''), content);
    if (r.parent) { const pp = pos(nodes[r.parent]); seg(p, pp, M.nest, content); label(zh ? '∈ 在其中' : '∈ inside', p.clone().lerp(pp, 0.5), 'lo', content); }
  }
  // operations
  for (const o of D.ops) {
    const a = pos(nodes[o.from]), b = pos(nodes[o.to]);
    const dir = b.clone().sub(a).normalize(); const a2 = a.clone().addScaledVector(dir, 0.1), b2 = b.clone().addScaledVector(dir, -0.2);
    if (o.evidence === 'inference') seg(a2, b2, M.inf, content);
    else { seg(a2, b2, M.ink, content); content.add(spindle(a2, b2, o.evidence === 'text')); }
    label((zh ? OPZ[o.type] : o.type.replace('_', ' ')) + (o.evidence === 'inference' ? ' ?' : ''), a2.clone().lerp(b2, 0.3), 'lo', content);
  }
  for (const [el, f] of axLabels) el.element.textContent = f();
}
const bA = document.getElementById('bA'), bC = document.getElementById('bC');
const setPlan = p => { plan = p; bA.classList.toggle('on', p === 'A'); bC.classList.toggle('on', p === 'C'); };
bA.onclick = () => { setPlan('A'); build(); };
bC.onclick = () => { if (!cReady) return; setPlan('C'); build(); };

// work switcher
const wbar = document.createElement('div'); wbar.id = 'works';
Object.assign(wbar.style, { position: 'fixed', right: '24px', top: '56px', zIndex: 5, display: 'flex', gap: '4px' });
document.body.appendChild(wbar);
ALL.forEach((w, i) => { const b = document.createElement('button'); b.textContent = i + 1; b.title = w.title;
  Object.assign(b.style, { font: 'inherit', fontSize: '12px', width: '26px', background: '#fff', border: '1px solid #000', cursor: 'pointer' });
  b.onclick = () => loadWork(i); wbar.appendChild(b); });
function loadWork(i) {
  cur = i; D = ALL[i];
  for (const k in nodes) delete nodes[k];
  D.carriers.forEach(c => nodes[c.id] = { ...c, isRef: false });
  D.referents.forEach(r => nodes[r.id] = { ...r, isRef: true });
  cReady = D.referents.every(r => r.zC !== null && r.zC !== undefined);
  bC.disabled = !cReady; if (!cReady && plan === 'C') setPlan('A');
  document.getElementById('note').textContent = cReady ? '' : '方案 C 尚未计算（需要 CLIP），暂时只能看方案 A';
  document.getElementById('title').textContent = D.title;
  document.getElementById('meta').textContent = `AIC ${D.aic_id} / ${D.artist} / ${D.date}` + (D.public_domain === false ? ' / 非 public domain' : '');
  [...wbar.children].forEach((b, j) => { b.style.background = j === i ? '#000' : '#fff'; b.style.color = j === i ? '#fff' : '#000'; });
  build();
}
loadWork(0);
document.getElementById('bL').onclick = () => { zh = !zh; build(); };

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fitCam(); controls.update(); renderer.setSize(innerWidth, innerHeight); css.setSize(innerWidth, innerHeight); });
(function loop() {
  requestAnimationFrame(loop); controls.update();
  content.traverse(o => { if (o.userData.billboard) o.quaternion.copy(camera.quaternion); });
  renderer.render(scene, camera); css.render(scene, camera);
})();
</script>
</body>
</html>
