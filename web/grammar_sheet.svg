<text x="8" y="100.45" font-size="11.5" fill="#333">从 C 出发的操作</text><text x="8" y="117.45" font-size="11" fill="#8a8a8a">起点是可见的</text></g><g transform="translate(748,186)"><rect x="6" y="0" width="224" height="62.45" fill="none" stroke="#e6e6e6"/><g transform="translate(6,0) scale(0.68)" fill="none" stroke="#111" stroke-width="1.62" stroke-linecap="round" stroke-linejoin="round"><path d="M70,62 Q170,-6 270,62" /></g><text x="8" y="82.45" font-size="13.5" fill="#111">弧</text><text x="8" y="100.45" font-size="11.5" fill="#333">从 R 出发的操作</text><text x="8" y="117.45" font-size="11" fill="#8a8a8a">缺席引出缺席，没有落脚点</text></g><line x1="40" y1="352" x2="1220" y2="352" stroke="#111" stroke-width="1.2"/><text x="40" y="374" font-size="14" font-weight="600" fill="#111">2 · R 的种类　旋转</text><text x="250" y="374" font-size="11.5" fill="#8a8a8a">同一个圆换朝向</text><g transform="translate(40,388)"><rect x="6" y="0" width="224" height="62.45" fill="none" stroke="#e6e6e6"/><g transform="translate(6,0) scale(0.68)" fill="none" stroke="#111" stroke-width="1.62" stroke-linecap="round" stroke-linejoin="round"><circle cx="170" cy="46" r="20" /><circle cx="170" cy="46" r="1.8" fill="#111" stroke="none"/></g><text x="8" y="82.45" font-size="13.5" fill="#111">存在者</text><text x="8" y="100.45" font-size="11.5" fill="#333">立圆 + 圆心点</text><text x="8" y="117.45" font-size="11" fill="#8a8a8a">kind = being</text></g><g transform="translate(276,388)"><rect x="6" y="0" width="224" height="62.45" fill="none" stroke="#e6e6e6"/><g transform="translate(6,0) scale(0.68)" fill="none" stroke="#111" stroke-width="1.62" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="170" cy="46" rx="34" ry="11" /></g><text x="8" y="82.45" font-size="13.5" fill="#111">经验</text><text x="8" y="100.45" font-size="11.5" fill="#333">平圆（水平，可容纳）</text><text x="8" y="117.45" font-size="11" fill="#8a8a8a">kind = experience</text></g><g transform="translate(512,388)"><rect x="6" y="0" width="224" height="62.45" fill="none" stroke="#e